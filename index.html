<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ff7a00">
    <meta name="description" content="JRV Rádio Web - Forró, alegria, música e informação.">
    <title>JRV Rádio Web | Forró e Alegria</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
    
    <!-- Skeleton -->
    <div class="skeleton-container">
        <div class="skeleton"></div>
    </div>
    
    <!-- Lazy Loading -->
    <img src="placeholder.jpg" data-src="actual-image.jpg" class="lazy-load" alt="Descrição">
    
    <!-- Smooth Animations -->
    <style>
        .fade-enter { opacity: 0; transform: translateY(20px); }
        .fade-enter-active { opacity: 1; transform: translateY(0); transition: all 0.3s ease; }
    </style>
    
    <!-- FONTES -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
    
    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Conteúdo original -->
    
    <!-- Observability -->
    <script src="https://cdn.sentry.io/sdk/7.0.0/sentry.min.js"></script>
    <script>
        Sentry.init({
            dsn: 'YOUR_DSN',
            integrations: [
                Sentry.browserTracingIntegration(),
                Sentry.replayIntegration()
            ],
            tracesSampleRate: 1.0
        });
    </script>
    
    <!-- JS -->
    <script src="script.js"></script>
</body>
</html>
